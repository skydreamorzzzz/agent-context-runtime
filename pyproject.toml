[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acr"
version = "0.1.0"
description = "Auditable, cost-aware context runtime MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
acr = "acr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
